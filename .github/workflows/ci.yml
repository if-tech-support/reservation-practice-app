name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-0123456789abcdef
      APP_ENV: ci
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Cloudflare Workers 向けにビルド
        run: bun run build
      - name: Node.js 向けにビルド
        run: bun run build:node
      - name: PostgreSQL にマイグレーションを適用
        run: bun run db:migrate:pg
      - name: Node.js 版を起動して動作確認
        run: |
          node .output/server/index.mjs &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          bash scripts/smoke.sh http://localhost:3000
